# Render Blueprint: 이 파일 하나로 화면(무료)과 서버를 같이 만든다.
services:
  - type: web
    name: reborn-lite-api
    runtime: python
    plan: standard # 2GB. 다 재고 나면 대시보드에서 Suspend하거나 free로 내린다
    region: singapore
    branch: main
    rootDir: backend
    # Whisper base 파일을 빌드 때 받아 두어 첫 시작을 빠르게 한다
    buildCommand: pip install -r requirements.txt && python -c "import whisper; whisper.load_model('base', download_root='whisper_cache')"
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 600
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # 이름이 이미 쓰이고 있으면 Render가 주소 뒤에 글자를 붙인다. 그때 실제 주소로 고친다.
      - key: FRONTEND_ORIGIN
        value: https://reborn-lite.onrender.com

  - type: web
    name: reborn-lite
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://reborn-lite-api.onrender.com
